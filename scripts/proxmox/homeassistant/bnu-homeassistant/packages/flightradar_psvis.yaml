# ──────────────────────────────────────────────────────────────────────────────
# PS-VIS Flight Alerts — bnu-homeassistant
# Deploy to: /config/packages/flightradar_psvis.yaml
#
# Sends a WhatsApp message to the Casa Blumenau group when aircraft PS-VIS departs
# from or lands at Blumenau Regional Airport (BNU / SSBL).
#
# HOW IT WORKS
#   The Flightradar24 integration (AlexandrErohin, v1.34.x) fires HA bus events when
#   an aircraft's on_ground flag flips between two 10 s scans:
#     • flightradar24_area_took_off / _area_landed     → any flight inside the configured
#       area bounds (the area is centred on the Blumenau airport point -26.8317,-49.0936)
#     • flightradar24_tracked_took_off / _tracked_landed → a flight in the "additional
#       tracked" list (e.g. PS-VIS once added via text.flightradar24_adicionar_ao_rastreamento)
#   Each event's data IS the full flight dict: aircraft_registration, latitude, longitude,
#   altitude, airport_origin_*/airport_destination_*, flight_number, callsign, etc.
#
#   The AREA events are the robust primary signal: they need no pre-tracking and survive
#   HA restarts (unlike the tracked list, which is in-memory and requires the aircraft to
#   be live in FR24 at the moment it is added). We listen to BOTH and dedupe.
#
# SCOPING TO BLUMENAU
#   We do NOT trust the area radius alone — instead every event is confirmed to be at
#   Blumenau by an explicit great-circle distance from the airport (≤ BLUMENAU_RADIUS_KM)
#   OR by the relevant airport code (origin on take-off / destination on landing) being
#   BNU/SSBL. The nearest other airport (Navegantes SBNF) is ~40 km away, far outside the
#   radius, so there is no ambiguity. Widen/replace this to alert on ALL PS-VIS
#   take-offs/landings by relaxing the `at_blumenau` variable below.
#
# Reuses rest_command.send_whatsapp_bnu (defined in family_presence.yaml — rest_commands
# are global) and !secret whatsapp_group_jid.
# ──────────────────────────────────────────────────────────────────────────────

input_boolean:
  psvis_flight_alerts:
    name: "Alertas de voo PS-VIS (Blumenau)"
    icon: mdi:airplane-alert
    # Master toggle. No `initial:` — HA restores the last value after a restart.

input_text:
  # Dedupe guard: epoch seconds of the last alert sent. The area and tracked events fire
  # in the SAME coordinator cycle (within ms) for a flight that is both in-area and
  # tracked, so without this the same take-off/landing would alert twice. A 90 s window
  # collapses the pair while never suppressing a genuine later transition.
  psvis_last_alert_ts:
    name: "PS-VIS último alerta (epoch)"
    max: 32
    icon: mdi:clock-outline

automation:
  - alias: "PS-VIS: WhatsApp on Blumenau departure/landing"
    id: psvis_blumenau_flight_alert
    mode: single      # drop the near-simultaneous area+tracked duplicate mid-run
    trigger:
      - platform: event
        event_type: flightradar24_area_took_off
        id: took_off
      - platform: event
        event_type: flightradar24_tracked_took_off
        id: took_off
      - platform: event
        event_type: flightradar24_area_landed
        id: landed
      - platform: event
        event_type: flightradar24_tracked_landed
        id: landed
    variables:
      # ── Aircraft of interest ────────────────────────────────────────────────
      raw_reg: "{{ (trigger.event.data.aircraft_registration | default('')) | upper | replace('-','') }}"
      direction: "{{ trigger.id }}"          # 'took_off' | 'landed'
      # ── Blumenau Regional Airport (BNU / SSBL) ─────────────────────────────
      bnu_lat: -26.8306007
      bnu_lon: -49.0903015
      blumenau_radius_km: 6
      ev_lat: "{{ trigger.event.data.latitude | default(none) }}"
      ev_lon: "{{ trigger.event.data.longitude | default(none) }}"
      # Great-circle distance (km) from the airport to the aircraft at the transition.
      # HA templates expose sin/cos/atan2/sqrt/pi; there is no radians(), so × pi/180.
      dist_km: >
        {% set la1 = ev_lat | float(none) %}
        {% set lo1 = ev_lon | float(none) %}
        {% if la1 is none or lo1 is none %}
          99999
        {% else %}
          {% set r = pi / 180 %}
          {% set dlat = (bnu_lat - la1) * r %}
          {% set dlon = (bnu_lon - lo1) * r %}
          {% set a = (sin(dlat / 2)) ** 2 + cos(la1 * r) * cos(bnu_lat * r) * (sin(dlon / 2)) ** 2 %}
          {{ (6371 * 2 * atan2(sqrt(a), sqrt(1 - a))) | round(2) }}
        {% endif %}
      o_iata: "{{ trigger.event.data.airport_origin_code_iata | default('', true) }}"
      o_icao: "{{ trigger.event.data.airport_origin_code_icao | default('', true) }}"
      d_iata: "{{ trigger.event.data.airport_destination_code_iata | default('', true) }}"
      d_icao: "{{ trigger.event.data.airport_destination_code_icao | default('', true) }}"
      at_blumenau: >
        {{ (dist_km | float(99999) <= blumenau_radius_km)
           or (direction == 'took_off' and (o_iata == 'BNU' or o_icao == 'SSBL'))
           or (direction == 'landed'   and (d_iata == 'BNU' or d_icao == 'SSBL')) }}
      # ── Other endpoint for the message (city → name → code, skipping Blumenau) ─
      # Single-line templates so YAML folding + Jinja don't inject stray whitespace.
      other_endpoint: >-
        {% if direction == 'took_off' %}{{ trigger.event.data.airport_destination_city | default('', true) or trigger.event.data.airport_destination_name | default('', true) or d_iata }}{% else %}{{ trigger.event.data.airport_origin_city | default('', true) or trigger.event.data.airport_origin_name | default('', true) or o_iata }}{% endif %}
      flight_label: >-
        {{ trigger.event.data.flight_number | default('', true) or trigger.event.data.callsign | default('', true) }}
      message: >-
        {% if direction == 'took_off' %}🛫 *PS-VIS decolou de Blumenau*{% if other_endpoint %}{{ '\n' }}✈️ Destino: {{ other_endpoint }}{% endif %}{% else %}🛬 *PS-VIS pousou em Blumenau*{% if other_endpoint %}{{ '\n' }}✈️ Origem: {{ other_endpoint }}{% endif %}{% endif %}{{ '\n' }}🕐 {{ now().strftime('%H:%M') }}{% if flight_label %}{{ '\n' }}🔖 Voo {{ flight_label }}{% endif %}
    condition:
      - condition: state
        entity_id: input_boolean.psvis_flight_alerts
        state: "on"
      # Only PS-VIS (registration may come as PS-VIS or PSVIS from FR24).
      - condition: template
        value_template: "{{ raw_reg == 'PSVIS' }}"
      # Only take-offs/landings AT Blumenau.
      - condition: template
        value_template: "{{ at_blumenau }}"
      # Dedupe: ignore a second matching event within 90 s of the last alert.
      - condition: template
        value_template: >
          {{ (now().timestamp() | int)
             - (states('input_text.psvis_last_alert_ts') | int(0)) > 90 }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.psvis_last_alert_ts
        data:
          value: "{{ now().timestamp() | int }}"
      - service: rest_command.send_whatsapp_bnu
        data:
          jid: !secret whatsapp_group_jid
          message: "{{ message }}"
