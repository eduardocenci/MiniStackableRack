# ──────────────────────────────────────────────────────────────────────────────
# PS-VIS Flight Alerts — bnu-homeassistant
# Deploy to: /config/packages/flightradar_psvis.yaml
#
# Sends a WhatsApp message to the Casa Blumenau group when aircraft PS-VIS departs
# from or lands at Blumenau Regional Airport (BNU / SSBL).
#
# HOW IT WORKS
#   The Flightradar24 integration (AlexandrErohin, v1.34.x) fires HA bus events when
#   an aircraft's on_ground flag flips between two 10 s scans:
#     • flightradar24_area_took_off / _area_landed     → any flight inside the configured
#       area bounds (the area is centred on the Blumenau airport point -26.8317,-49.0936)
#     • flightradar24_tracked_took_off / _tracked_landed → a flight in the "additional
#       tracked" list (e.g. PS-VIS once added via text.flightradar24_adicionar_ao_rastreamento)
#   Each event's data IS the full flight dict: aircraft_registration, latitude, longitude,
#   altitude, airport_origin_*/airport_destination_*, flight_number, callsign, etc.
#
#   The AREA events are the robust primary signal: they need no pre-tracking and survive
#   HA restarts (unlike the tracked list, which is in-memory and requires the aircraft to
#   be live in FR24 at the moment it is added). We listen to BOTH and dedupe.
#
# SCOPING TO BLUMENAU
#   We do NOT trust the area radius alone — instead every event is confirmed to be at
#   Blumenau by an explicit great-circle distance from the airport (≤ BLUMENAU_RADIUS_KM)
#   OR by the relevant airport code (origin on take-off / destination on landing) being
#   BNU/SSBL. The nearest other airport (Navegantes SBNF) is ~40 km away, far outside the
#   radius, so there is no ambiguity. Widen/replace this to alert on ALL PS-VIS
#   take-offs/landings by relaxing the `at_blumenau` variable below.
#
# Reuses rest_command.send_whatsapp_bnu (defined in family_presence.yaml — rest_commands
# are global) and !secret whatsapp_group_jid.
#
# MESSAGE OVERVIEW (2026-08-29)
#   The event dict carries much more than the city: real departure/arrival epochs,
#   aircraft model, airport names/codes/coordinates and the FR24 flight id. The
#   message shows route, times+duration, model and the FR24 playback link. Lines
#   whose source field is missing are omitted — FR24 data can be partial (a real
#   PS-VIS flight has been seen with no destination airport at all).
#
# POST-FLIGHT REPORT — ONE message per landing (decisão Eduardo 2026-08-29)
#   On LANDING nothing is sent from here on the happy path: psvis-tracker
#   (LXC 101 @ 10.1.1.126:8790, scripts/proxmox/docker/bnu-docker/psvis-tracker/)
#   pulls the FR24 playback trail and sends a SINGLE image message — the
#   altitude/speed profile + route map with the full caption (route, times,
#   model, cruise altitude/speed, FR24 link) — a couple of minutes after
#   touchdown. Reliability is layered so the alert can never be lost:
#     • FR24 playback fails for good → the tracker sends `fallback_text`
#       (the enriched message rendered here) as plain text;
#     • the tracker itself is down/rejects → this automation detects it via
#       response_variable and sends that same text directly.
#   TAKE-OFFS keep the immediate plain-text path (there is no chart to attach).
# ──────────────────────────────────────────────────────────────────────────────

rest_command:
  # Triggers the post-flight report (chart + cruise stats) on psvis-tracker.
  psvis_flight_report:
    url: "http://10.1.1.126:8790/report"
    method: POST
    content_type: application/json
    payload: '{"flight_id": "{{ flight_id }}", "direction": "{{ direction }}", "fallback_text": {{ fallback | default("") | to_json }}}'

input_boolean:
  psvis_flight_alerts:
    name: "Alertas de voo PS-VIS (Blumenau)"
    icon: mdi:airplane-alert
    # Master toggle. No `initial:` — HA restores the last value after a restart.

input_text:
  # Dedupe guard: epoch seconds of the last alert sent. The area and tracked events fire
  # in the SAME coordinator cycle (within ms) for a flight that is both in-area and
  # tracked, so without this the same take-off/landing would alert twice. A 90 s window
  # collapses the pair while never suppressing a genuine later transition.
  psvis_last_alert_ts:
    name: "PS-VIS último alerta (epoch)"
    max: 32
    icon: mdi:clock-outline

automation:
  - alias: "PS-VIS: WhatsApp on Blumenau departure/landing"
    id: psvis_blumenau_flight_alert
    mode: single      # drop the near-simultaneous area+tracked duplicate mid-run
    trigger:
      - platform: event
        event_type: flightradar24_area_took_off
        id: took_off
      - platform: event
        event_type: flightradar24_tracked_took_off
        id: took_off
      - platform: event
        event_type: flightradar24_area_landed
        id: landed
      - platform: event
        event_type: flightradar24_tracked_landed
        id: landed
    variables:
      # ── Aircraft of interest ────────────────────────────────────────────────
      raw_reg: "{{ (trigger.event.data.aircraft_registration | default('')) | upper | replace('-','') }}"
      direction: "{{ trigger.id }}"          # 'took_off' | 'landed'
      # ── Blumenau Regional Airport (BNU / SSBL) ─────────────────────────────
      bnu_lat: -26.8306007
      bnu_lon: -49.0903015
      blumenau_radius_km: 6
      ev_lat: "{{ trigger.event.data.latitude | default(none) }}"
      ev_lon: "{{ trigger.event.data.longitude | default(none) }}"
      # Great-circle distance (km) from the airport to the aircraft at the transition.
      # HA templates expose sin/cos/atan2/sqrt/pi; there is no radians(), so × pi/180.
      dist_km: >
        {% set la1 = ev_lat | float(none) %}
        {% set lo1 = ev_lon | float(none) %}
        {% if la1 is none or lo1 is none %}
          99999
        {% else %}
          {% set r = pi / 180 %}
          {% set dlat = (bnu_lat - la1) * r %}
          {% set dlon = (bnu_lon - lo1) * r %}
          {% set a = (sin(dlat / 2)) ** 2 + cos(la1 * r) * cos(bnu_lat * r) * (sin(dlon / 2)) ** 2 %}
          {{ (6371 * 2 * atan2(sqrt(a), sqrt(1 - a))) | round(2) }}
        {% endif %}
      o_iata: "{{ trigger.event.data.airport_origin_code_iata | default('', true) }}"
      o_icao: "{{ trigger.event.data.airport_origin_code_icao | default('', true) }}"
      d_iata: "{{ trigger.event.data.airport_destination_code_iata | default('', true) }}"
      d_icao: "{{ trigger.event.data.airport_destination_code_icao | default('', true) }}"
      at_blumenau: >
        {{ (dist_km | float(99999) <= blumenau_radius_km)
           or (direction == 'took_off' and (o_iata == 'BNU' or o_icao == 'SSBL'))
           or (direction == 'landed'   and (d_iata == 'BNU' or d_icao == 'SSBL')) }}
      # ── Enriched overview fields (all defensive — any field may be missing) ─
      model: "{{ trigger.event.data.aircraft_model | default('', true) }}"
      fr24_id: "{{ trigger.event.data.id | default('', true) }}"
      dep_ts: "{{ trigger.event.data.time_real_departure | default(0, true) | int(0) }}"
      # At the landed event FR24 usually hasn't stamped time_real_arrival yet —
      # the event fires within one 10 s scan of touchdown, so now() IS the arrival.
      arr_ts: "{{ trigger.event.data.time_real_arrival | default(0, true) | int(0) or (now().timestamp() | int) }}"
      # ── The non-Blumenau endpoint: name (city prefix + 'Airport' stripped),
      #    codes and coordinates. On take-off it's the destination, else origin.
      other_city: >-
        {{ (trigger.event.data.airport_destination_city if direction == 'took_off' else trigger.event.data.airport_origin_city) | default('', true) }}
      other_raw_name: >-
        {{ (trigger.event.data.airport_destination_name if direction == 'took_off' else trigger.event.data.airport_origin_name) | default('', true) }}
      other_iata: "{{ d_iata if direction == 'took_off' else o_iata }}"
      other_icao: "{{ d_icao if direction == 'took_off' else o_icao }}"
      other_lat: >-
        {{ (trigger.event.data.airport_destination_latitude if direction == 'took_off' else trigger.event.data.airport_origin_latitude) | default(none, true) }}
      other_lon: >-
        {{ (trigger.event.data.airport_destination_longitude if direction == 'took_off' else trigger.event.data.airport_origin_longitude) | default(none, true) }}
      # 'Sao Paulo Campo de Marte Airport' → 'Campo de Marte'
      other_name: >-
        {%- set n = other_raw_name | replace(' Airport', '') | replace('Airport', '') | trim -%}
        {%- if other_city and n.startswith(other_city) -%}{%- set n = n[(other_city | length):] -%}{%- endif -%}
        {{ n | trim(' -–') }}
      other_codes: >-
        {%- if other_iata and other_icao and other_iata != other_icao -%}{{ other_iata }}/{{ other_icao }}{%- else -%}{{ other_iata or other_icao }}{%- endif -%}
      # 'Campo de Marte (RTE/SBMT) — Sao Paulo'
      other_label: >-
        {%- set nm = other_name or other_city -%}
        {%- set head = (nm ~ (' (' ~ other_codes ~ ')' if other_codes else '')) if nm else other_codes -%}
        {{ head ~ (' — ' ~ other_city if other_city and other_city != nm else '') }}
      # Great-circle route length (km) from Blumenau to the other airport.
      route_km: >
        {% set la1 = other_lat | float(none) %}
        {% set lo1 = other_lon | float(none) %}
        {% if la1 is none or lo1 is none %}
          0
        {% else %}
          {% set r = pi / 180 %}
          {% set dlat = (bnu_lat - la1) * r %}
          {% set dlon = (bnu_lon - lo1) * r %}
          {% set a = (sin(dlat / 2)) ** 2 + cos(la1 * r) * cos(bnu_lat * r) * (sin(dlon / 2)) ** 2 %}
          {{ (6371 * 2 * atan2(sqrt(a), sqrt(1 - a))) | round(0) | int }}
        {% endif %}
      dep_hm: "{{ (dep_ts | int(0)) | timestamp_custom('%H:%M', true) if (dep_ts | int(0)) else '' }}"
      arr_hm: "{{ (arr_ts | int(0)) | timestamp_custom('%H:%M', true) }}"
      dur_txt: >-
        {%- set dp = dep_ts | int(0) -%}
        {%- if dp -%}
        {%- set d = (arr_ts | int(0)) - dp -%}
        {%- if d >= 3600 -%}{{ d // 3600 }}h{{ '%02d' | format((d % 3600) // 60) }}{%- else -%}{{ d // 60 }} min{%- endif -%}
        {%- endif -%}
      # Empty lines are dropped by `select` (truthy filter) — HA's sandboxed
      # Jinja forbids list.append, so the message is assembled declaratively.
      message: >-
        {%- if direction == 'took_off' -%}
        {%- set header = '🛫 *PS-VIS decolou de Blumenau*' -%}
        {%- set endpoint_l = '✈️ Destino: ' ~ other_label if other_label else '' -%}
        {%- set times_l = '🕐 Decolagem ' ~ (dep_hm or now().strftime('%H:%M')) -%}
        {%- else -%}
        {%- set header = '🛬 *PS-VIS pousou em Blumenau*' -%}
        {%- set endpoint_l = '✈️ Origem: ' ~ other_label if other_label else '' -%}
        {%- set times_l = '🕐 Saída ' ~ dep_hm ~ ' → Chegada ' ~ arr_hm ~ ' (' ~ dur_txt ~ ')' if dep_hm else '🕐 ' ~ arr_hm -%}
        {%- endif -%}
        {%- set model_l = '🛩️ ' ~ model if model else '' -%}
        {%- set route_l = '📏 Rota: ~' ~ (route_km | int) ~ ' km' if (route_km | int(0)) > 0 else '' -%}
        {%- set link_l = '🔗 https://www.flightradar24.com/data/aircraft/ps-vis#' ~ fr24_id if fr24_id else '' -%}
        {{ [header, endpoint_l, times_l, model_l, route_l, link_l] | select | join('\n') }}
    condition:
      - condition: state
        entity_id: input_boolean.psvis_flight_alerts
        state: "on"
      # Only PS-VIS (registration may come as PS-VIS or PSVIS from FR24).
      - condition: template
        value_template: "{{ raw_reg == 'PSVIS' }}"
      # Only take-offs/landings AT Blumenau.
      - condition: template
        value_template: "{{ at_blumenau }}"
      # Dedupe: ignore a second matching event within 90 s of the last alert.
      - condition: template
        value_template: >
          {{ (now().timestamp() | int)
             - (states('input_text.psvis_last_alert_ts') | int(0)) > 90 }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.psvis_last_alert_ts
        data:
          value: "{{ now().timestamp() | int }}"
      - choose:
          # Landing: delegate the single image+caption message to psvis-tracker;
          # if the call itself fails (down/refused), fall back to plain text here.
          - conditions:
              - condition: template
                value_template: "{{ direction == 'landed' }}"
            sequence:
              - service: rest_command.psvis_flight_report
                continue_on_error: true
                response_variable: tracker_resp
                data:
                  flight_id: "{{ fr24_id }}"
                  direction: landed
                  fallback: "{{ message }}"
              - if:
                  - condition: template
                    value_template: >
                      {{ tracker_resp is not defined
                         or (tracker_resp.status | default(500) | int) >= 300 }}
                then:
                  - service: rest_command.send_whatsapp_bnu
                    data:
                      jid: !secret whatsapp_group_jid
                      message: "{{ message }}"
        default:
          # Take-off: immediate plain text, as before.
          - service: rest_command.send_whatsapp_bnu
            data:
              jid: !secret whatsapp_group_jid
              message: "{{ message }}"
