# "Lights" dashboard (sidebar 'Lights', url_path led-lights) — the mia LED controllers, one page:
# 'All WLED' light group (helper created 2026-09-05 via the group config flow) on top, then one column per WLED
# Gledopto controller (WLED 16.0.1, discovered by zeroconf and confirmed 2026-09-05; devices/entities renamed
# from the colliding 'WLED-Gledopto' to the LAN last octet: wled_60 = 93 LEDs, wled_61 = 59 LEDs, wled_64 = 119 LEDs,
# wled_65 = 127 LEDs on the rack (P2S + sun rule), wled_66 = 24 LEDs in the guest bedroom (added 2026-09-08, brightness follows the
# sun dial of packages/sun_night_mix.yaml through packages/guest_led.yaml — its section is at the bottom) —
# rename again once each strip's room is known; no WLED playlists exist so the playlist select is left out), then a placeholder for the FancyLEDs controller at 192.168.2.63
# (Tuya chip, cloud-only: TCP 6668 refused and no LAN broadcasts, so it needs the Tuya cloud integration — see README).
# Storage-mode dashboard: applied over the websocket API by apply_dashboard.py in this folder, not read by HA.
# Regenerate from the scratch generator or edit by hand; both are fine — this yaml is the source of truth.
dashboard:
  url_path: led-lights
  title: Lights
  icon: mdi:led-strip-variant
  show_in_sidebar: true
  require_admin: false
  mode: storage
config:
  title: Lights
  views:
  - title: Lights
    path: lights
    icon: mdi:led-strip-variant
    type: sections
    max_columns: 3
    sections:
    - type: grid
      column_span: 3
      cards:
      - type: heading
        heading: All WLED
        heading_style: title
        icon: mdi:lightbulb-group
        badges:
        - type: entity
          entity: light.wled_60
          name: '.60'
        - type: entity
          entity: light.wled_61
          name: '.61'
        - type: entity
          entity: light.wled_64
          name: '.64'
        - type: entity
          entity: light.wled_65_main
          name: '.65'
        - type: entity
          entity: light.wled_66
          name: '.66'
      - type: tile
        entity: light.all_wled
        name: All WLED
        features_position: bottom
        features:
        - type: toggle
        - type: light-brightness
        grid_options:
          columns: full
    - type: grid
      cards:
      - type: heading
        heading: WLED .60 · 93 LEDs
        heading_style: title
        icon: mdi:led-strip-variant
        badges:
        - type: entity
          entity: sensor.wled_60_estimated_current
      - type: tile
        entity: light.wled_60
        name: WLED .60
        features_position: bottom
        features:
        - type: toggle
        - type: light-brightness
        grid_options:
          columns: full
      - type: entities
        state_color: true
        entities:
        - entity: select.wled_60_preset
        - entity: select.wled_60_color_palette
        - entity: number.wled_60_speed
        - entity: number.wled_60_intensity
        - type: divider
        - entity: switch.wled_60_nightlight
        - entity: switch.wled_60_reverse
        - entity: switch.wled_60_freeze
        - entity: switch.wled_60_sync_send
        - entity: switch.wled_60_sync_receive
        - entity: select.wled_60_live_override
        - type: divider
        - entity: sensor.wled_60_max_current
        - entity: sensor.wled_60_led_count
        - entity: sensor.wled_60_ip
        - entity: update.wled_60_firmware
        - entity: button.wled_60_restart
    - type: grid
      cards:
      - type: heading
        heading: WLED .61 · 59 LEDs
        heading_style: title
        icon: mdi:led-strip-variant
        badges:
        - type: entity
          entity: sensor.wled_61_estimated_current
      - type: tile
        entity: light.wled_61
        name: WLED .61
        features_position: bottom
        features:
        - type: toggle
        - type: light-brightness
        grid_options:
          columns: full
      - type: entities
        state_color: true
        entities:
        - entity: select.wled_61_preset
        - entity: select.wled_61_color_palette
        - entity: number.wled_61_speed
        - entity: number.wled_61_intensity
        - type: divider
        - entity: switch.wled_61_nightlight
        - entity: switch.wled_61_reverse
        - entity: switch.wled_61_freeze
        - entity: switch.wled_61_sync_send
        - entity: switch.wled_61_sync_receive
        - entity: select.wled_61_live_override
        - type: divider
        - entity: sensor.wled_61_max_current
        - entity: sensor.wled_61_led_count
        - entity: sensor.wled_61_ip
        - entity: update.wled_61_firmware
        - entity: button.wled_61_restart
    - type: grid
      cards:
      - type: heading
        heading: WLED .64 · 119 LEDs
        heading_style: title
        icon: mdi:led-strip-variant
        badges:
        - type: entity
          entity: sensor.wled_64_estimated_current
      - type: tile
        entity: light.wled_64
        name: WLED .64
        features_position: bottom
        features:
        - type: toggle
        - type: light-brightness
        grid_options:
          columns: full
      - type: entities
        state_color: true
        entities:
        - entity: select.wled_64_preset
        - entity: select.wled_64_color_palette
        - entity: number.wled_64_speed
        - entity: number.wled_64_intensity
        - type: divider
        - entity: switch.wled_64_nightlight
        - entity: switch.wled_64_reverse
        - entity: switch.wled_64_freeze
        - entity: switch.wled_64_sync_send
        - entity: switch.wled_64_sync_receive
        - entity: select.wled_64_live_override
        - type: divider
        - entity: sensor.wled_64_max_current
        - entity: sensor.wled_64_led_count
        - entity: sensor.wled_64_ip
        - entity: update.wled_64_firmware
