        - type: divider
        - entity: binary_sensor.p2s_door
          name: 'Input 1 · door'
        - entity: binary_sensor.p2s_print_issue
          name: 'Input 2 · print issue'
        - type: attribute
          entity: binary_sensor.p2s_print_issue
          attribute: reason
          name: '      why'
        - entity: sensor.sun_night_mix
          name: 'Input 3 · night mix (sun dial)'
        - type: attribute
          entity: sensor.sun_night_mix
          attribute: reason
          name: '      why'
        - type: attribute
          entity: sensor.sun_night_mix
          attribute: elevation_now
          name: '      sun elevation now (interpolated)'
          suffix: '°'
        - entity: input_number.sun_day_elevation
          name: '      fully day above'
        - entity: input_number.sun_night_elevation
          name: '      fully night below'
        - entity: input_number.p2s_led_cap_night_brightness
          name: '      cap/plate brightness at night'
        - type: divider
        - entity: sensor.p2s_led_preset
          name: 'Decision 1 · preset id'
        - type: attribute
          entity: sensor.p2s_led_preset
          attribute: preset_name
          name: '      preset name'
        - type: attribute
          entity: sensor.p2s_led_preset
          attribute: because
          name: '      because'
        - entity: sensor.p2s_led_layers
          name: 'Decision 2 · layers (night mix)'
        - type: attribute
          entity: sensor.p2s_led_layers
          attribute: reason
          name: '      opacities'
        - type: attribute
          entity: sensor.p2s_led_layers
          attribute: day_bri
          name: '      day layer bri sent (0-255)'
        - type: attribute
          entity: sensor.p2s_led_layers
          attribute: night_bri
          name: '      night layer bri sent (0-255)'
        - type: attribute
          entity: sensor.p2s_led_layers
          attribute: cap_bri
          name: '      cap/plate bri sent (0-255)'
        - type: divider
        - entity: select.wled_65_preset
          name: 'Strip · active preset (blank = preset 4 + dial)'
        - entity: light.wled_65
          name: 'Strip · day layer'
        - entity: light.wled_65_segment_1
          name: 'Strip · night layer'
        - entity: light.wled_65_segment_2
          name: 'Strip · cap/plate'
        - entity: automation.p2s_led_apply_preset
          name: 'Executor automation'
        - entity: counter.p2s_led_resends
          name: '      commands the strip did not take (re-sent)'
        grid_options:
          columns: 18
      - type: markdown
        title: How it decides
        content: |-
          {% set door = is_state('binary_sensor.p2s_door', 'on') %}{% set issue = is_state('binary_sensor.p2s_print_issue', 'on') %}{% set mix = states('sensor.sun_night_mix') | int(0) %}{% set n = namespace(p={}) %}{% for id in ['3', '4', '5'] %}{% set n.p = dict(n.p, **{id: (state_attr('sensor.wled_65_presets', id) or {}).get('n', '?')}) %}{% endfor %}{% set rep = states('select.wled_65_preset') %}{% set rep_known = rep not in ['unknown', 'unavailable', 'none', ''] %}
          The whole rule is three templates: `sensor.sun_night_mix` (the sun dial, `packages/sun_night_mix.yaml`), `sensor.p2s_led_preset` (which preset) and `sensor.p2s_led_layers` (the three layer opacities), both in `packages/p2s_led.yaml`; the automation only forwards them to the strip. Preset names below are read from the strip.

          1. **Door open → preset 5 · {{ n.p['5'] }}** — {{ '✅ active now' if door else 'not now (door closed)' }}
          2. **else print issue → preset 3 · {{ n.p['3'] }}** — {{ ('✅ active now' if not door else '⏸ true, but overruled by the open door') if issue else 'not now (' ~ state_attr('binary_sensor.p2s_print_issue', 'reason') ~ ')' }}
          3. **else → preset 4 · {{ n.p['4'] }}**, day and night looks blended by the sun — {{ '✅ active now at ' ~ mix ~ ' % night (' ~ state_attr('sensor.sun_night_mix', 'phase') ~ ')' if (not door and not issue) else 'not now' }}

          **Now:** preset **{{ states('sensor.p2s_led_preset') }} · {{ state_attr('sensor.p2s_led_preset', 'preset_name') }}** because {{ state_attr('sensor.p2s_led_preset', 'because') }}. Layers: {{ state_attr('sensor.p2s_led_layers', 'reason') }}.
          Strip reports **{{ rep if rep_known else 'preset 4 with the dial applied' }}** · link **{{ states('input_boolean.p2s_led_link') }}** · last applied {{ relative_time(state_attr('automation.p2s_led_apply_preset', 'last_triggered')) ~ ' ago' if state_attr('automation.p2s_led_apply_preset', 'last_triggered') else 'never' }}{{ ' · ⚠️ strip and decision differ' if (rep_known and rep != state_attr('sensor.p2s_led_preset', 'preset_name') and states('input_boolean.p2s_led_link') == 'on') else '' }}.

          *Night mix* = where the sun sits between the two sliders: 0 % while its elevation is above *fully day above* ({{ states('input_number.sun_day_elevation') }}°), 100 % below *fully night below* ({{ states('input_number.sun_night_elevation') }}°), linear in between in 1 % steps. Home Assistant only samples the sun every 2 minutes in twilight, so the dial uses the sun's elevation *now*, interpolated between HA's own sunset and dusk (or dawn and sunrise) times, and re-evaluates every 20 s — about one step every 14 s over Miami's 24-minute twilight (next sunset {{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}, dusk {{ as_timestamp(state_attr('sun.sun', 'next_dusk')) | timestamp_custom('%H:%M') }}, dawn {{ as_timestamp(state_attr('sun.sun', 'next_dawn')) | timestamp_custom('%H:%M') }}, sunrise {{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}). Preset 4 holds both looks as two full-length layers — *Day (Flow Stripe)* and *Night (Colorwaves)*, the look of preset 7, blended additively — plus the *Cap/Plate* segment, which stays lit at night at the level of its slider. Each step sets the day layer's opacity to 255·(1−mix)^2.8, the night layer's to 255·mix^2.8 and the cap/plate's between its day and night levels (WLED composites in gamma space, so that is a plain linear dissolve) and crossfades over 20 s, so the day look melts into the night look continuously. A *print issue* = the printer's print error is on, or print status is `failed`, or an HMS message of severity serious/fatal ("common" reminders such as lubrication do not count). Presets are sent by WLED id; keep 3, 4 and 5 for issue / blend / door.
        grid_options:
          columns: 18
      - type: history-graph
