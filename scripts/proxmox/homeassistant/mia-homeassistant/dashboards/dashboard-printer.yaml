# "Printer" dashboard (sidebar 'Printer', url_path 3d-printer) — the mia Bambu Lab P2S 3D printer
# (model N7, serial 22E8AJ581301903, fw 01.02.00.00, hw AP02; LAN 192.168.2.72 = UCG reservation `bambu-p2s`,
# MAC 60:32:3b:9f:fc:f8, SSID Cenci-IoT). HA integration: HACS greghesp/ha-bambulab v2.2.25 (`bambu_lab`,
# entry 01M1T7HD30E09JP6FGS1H2FR2M) in LAN mode — local MQTT :8883, user `bblp`, password = the printer's LAN
# access code (`MIA_BAMBU_P2S_ACCESS_CODE` in the root .env); the printer itself stays bound to the Bambu cloud.
# Entity ids were shortened from `p2s_22e8aj581301903_*` to `p2s_*` (device names "P2S" / "P2S External Spool",
# 2026-09-05) — if the entry is ever re-created, rename again or update the ids below.
# One page: status heading + progress gauge + cover image on top, then Job · Temperatures & fans ·
# Filament (external spool + AMS 2 Pro `p2s_ams_1_*`, 4 trays) / Health columns, 24 h history and the identity
# card at the bottom. HMS / print errors and the tray list are rendered from entity attributes by markdown
# templates. No control buttons (pause/resume/stop, fans, speed): fw 01.02.00.00 wants signed MQTT commands
# unless Developer Mode is enabled on the printer — the integration then creates them (rename + add here).
# Camera: needs *LAN Mode Liveview* ON at the printer (enabled 2026-09-05 → rtsps://192.168.2.72:322/streaming/live/1;
# with it off ha-bambulab 2.2.25 fails to add camera.p2s_camera — urlparse TypeError, see README). Top row: the
# integration's bundled print_status-card in `graphic` style (P2S rendering with live overlays; resource
# /bambu_lab/ha-bambulab-cards.js, bundled cards take HA *device ids*) beside the HACS PrintWatch card
# (drkpxl/printwatch-card 1.2.0, stills every 5 s — kept for comparison, see README), both pinned to 12 rows so the
# grid does not stretch; then a native picture-entity of camera.p2s_camera in `auto` mode (a still every 10 s,
# tap for the live view) and the native tiles/gauge. `auto`, not `live`: the printer accepts ONE RTSPS client and
# the frontend's WebRTC→HLS fallback spawns HA's legacy stream worker, which then fights go2rtc for that slot
# (blank card, "i/o timeout" / "Error demuxing stream" in the log); stills go through go2rtc alone and are stable.
# The bundled `minimal` style was dropped: its camera pane is HA's MJPEG proxy, which for this integration returns
# the black "!" placeholder from camera_image(). The Filament column opens with the ams-card (vector) and the
# external spool-card. The bundled print_control-card is left out: it drives buttons that only exist with Developer
# Mode. Layout: this first section spans 3 columns, so its grid has 36 columns (tiles clamp to a 6-column minimum) —
# size cards there in 36ths and give auto-height custom cards explicit rows.
# "LED strip .65 (rack) ← P2S" section (2026-09-06): the strip follows the printer and the sun (a continuous day/night blend) through packages/p2s_led.yaml
# (door open → preset 5 · else print issue → 3 · else 4); the section lists the inputs, the decision
# (sensor.p2s_led_preset + attributes), what the strip reports, the executor automation, and a markdown card that
# re-states the rule with the active branch marked — the logic is meant to be readable here, not hidden.
# Storage-mode dashboard: applied over the websocket API by apply_dashboard.py in this folder
# (`python apply_dashboard.py dashboard-printer.yaml`), not read by HA. This yaml is the source of truth.
dashboard:
  url_path: 3d-printer
  title: Printer
  icon: mdi:printer-3d-nozzle
  show_in_sidebar: true
  require_admin: false
  mode: storage
config:
  title: Printer
  views:
