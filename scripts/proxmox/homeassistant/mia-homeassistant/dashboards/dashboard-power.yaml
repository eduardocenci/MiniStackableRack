    column_span: 3
    cards:
    - type: markdown
      content: '**Rename an outlet:** tap its row → ⚙ (top-right of the dialog) → edit **Name** (and Entity ID if you like)
        → Update. The switch row and its "power" row are separate entities — rename the switch; the meter follows the naming
