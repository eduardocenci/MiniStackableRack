# "Power" dashboard (sidebar 'Power', url_path power-strips) — all three mia power strips:
# per-outlet on/off, live watts, and a history graph per strip.
# Storage-mode dashboard: applied over the websocket API by power_panel.py in this folder
# (lovelace/dashboards/create once, then lovelace/config/save), not read by HA from this file.
# Quick rename from the panel: tap any row -> gear icon (top-right of the dialog) -> Name -> Update.
# Entity ids: Tapo P316M via Matter (den_power_strip_rack_*, endpoint N = outlet N: switch_N and its meters *_N — the meters sat on
# endpoints 7-12 until 2026-09-05, when the strip re-presented them on 1-6),
# HS300s via tplink (tp_link_power_strip_f845_* desk strip .50, tp_link_power_strip_fdb8_* living-room strip .51).
title: Power
views:
- title: Power
  path: power
  icon: mdi:power-plug-outline
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Power Strip Rack · Tapo P316M (.52)
      heading_style: title
      badges:
      - type: entity
        entity: sensor.power_strip_rack_total_power
        name: total
    - type: entities
      state_color: true
      entities:
      - entity: switch.den_power_strip_rack_switch_1
        name: 1 · Verizon 5G Home
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_1
        name: '      power'
        icon: mdi:flash
      - entity: switch.den_power_strip_rack_switch_2
        name: 2 · Milwaukee Battery Charger
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_2
        name: '      power'
        icon: mdi:flash
      - entity: switch.den_power_strip_rack_switch_3
        name: 3 · Rack (MiniPC, network, KVM)
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_3
        name: '      power'
        icon: mdi:flash
      - entity: switch.den_power_strip_rack_switch_4
        name: 4 · NAS
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_4
        name: '      power'
        icon: mdi:flash
      - entity: switch.den_power_strip_rack_switch_5
        name: 5 · Anker USB Power Supply (Pi, Monitor)
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_5
        name: '      power'
        icon: mdi:flash
      - entity: switch.den_power_strip_rack_switch_6
        name: 6 · (empty)
        icon: mdi:power-socket-us
      - entity: sensor.den_power_strip_rack_power_6
        name: '      power'
        icon: mdi:flash
    - type: history-graph
      title: Power Strip Rack outlets (W)
      hours_to_show: 6
      entities:
      - entity: sensor.den_power_strip_rack_power_1
        name: Verizon 5G Home
      - entity: sensor.den_power_strip_rack_power_3
        name: Rack
      - entity: sensor.den_power_strip_rack_power_4
        name: NAS
      - entity: sensor.den_power_strip_rack_power_5
        name: Pi + Monitor
  - type: grid
    cards:
    - type: heading
      heading: Power Strip Desk · Kasa HS300 (.50)
