services:
  psvis-tracker:
    build: .
    container_name: psvis-tracker
    restart: always
    ports:
      - "8790:8000"     # HA calls http://10.1.1.126:8790/report on landing
    environment:
      # values from /opt/psvis-tracker/.env on the LXC (mirrors repo-root .env)
      WAHA_BASE_URL: "http://waha:3000"
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_SESSION: "${WAHA_SESSION:-default}"
      GROUP_JID: "${GROUP_JID}"                 # Casa Blumenau family group
      TEST_GROUP_JID: "${TEST_GROUP_JID:-}"     # SmokeTests group ({"test": true})
      REG: "PS-VIS"
      SELF_URL: "http://psvis-tracker:8000"     # how WAHA fetches the chart PNG
      INITIAL_DELAY_S: "120"   # let FR24 finalize the track after touchdown
      RETRY_S: "60"
      MAX_TRIES: "10"
      SYNC_INTERVAL_S: "900"   # universal capture: any-airport landings ≤15 min
      AIRBORNE_POLL_S: "300"   # airborne watch: any-airport take-offs ≤5 min
      HOME_ICAO: "SSBL"        # HA announces take-offs here itself
      TZ: "America/Sao_Paulo"
    volumes:
      - ./data:/data

# Joins WAHA's network so waha:3000 resolves and WAHA can fetch our chart URL.
networks:
  default:
    name: waha_default
    external: true
