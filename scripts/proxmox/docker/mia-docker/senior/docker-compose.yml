# senior stack — mia-docker (LXC 102, 192.168.2.23), /opt/senior/.
# Every container carries the senior- prefix. Secrets live in /opt/senior/.env (root-only, never printed) under the
# same MIA_SENIOR_* names as the repo-root .env (MIA section); .env.example lists them.
# Images pinned to releases at least 14 days old (fleet update rule). senior-acervo:local is built on the LXC from
# the application repo (see README.md → "Build the local image").
name: senior

x-acervo: &acervo
  image: senior-acervo:local
  restart: unless-stopped
  user: "10001"
  environment: &acervo-env
    TZ: America/Sao_Paulo
  volumes:
    - ./acervo:/acervo:ro

services:
  senior-waha:
    image: devlikeapro/waha:noweb-2026.9.2
    container_name: senior-waha
    restart: unless-stopped
    ports:
      - "3000:3000"            # LAN only (no WAN forward); API key + dashboard login required
    environment:
      TZ: America/Sao_Paulo
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_BASE_URL: http://192.168.2.23:3000   # media URLs must not say localhost (bnu incident 2026-10-03)
      WAHA_PRINT_QR: "False"
      WAHA_API_KEY: ${MIA_SENIOR_WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${MIA_SENIOR_WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${MIA_SENIOR_WAHA_DASHBOARD_PASSWORD}
      # webhook (message.any → senior-n8n, shared-secret header) lives in the session config, set by setup-senior.sh
    volumes:
      - ./waha/sessions:/app/.sessions
      - ./waha/media:/app/.media

  senior-postgres:
    image: postgres:17.10-alpine
    container_name: senior-postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: senior
      POSTGRES_PASSWORD: ${MIA_SENIOR_POSTGRES_PASSWORD}
      POSTGRES_DB: acervo_bot
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # schema + server-only seed, first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senior -d acervo_bot"]
      interval: 30s
      timeout: 5s
      retries: 5
    # no published port: only the senior-* containers reach it

  senior-n8n:
    image: n8nio/n8n:2.43.7
    container_name: senior-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"            # LAN only; owner account set on first visit
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: senior-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: senior
      DB_POSTGRESDB_PASSWORD: ${MIA_SENIOR_POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${MIA_SENIOR_N8N_ENCRYPTION_KEY}   # backed up with .env; credentials are lost without it
      N8N_HOST: 192.168.2.23
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://192.168.2.23:5678/
      WEBHOOK_URL: http://senior-n8n:5678/
      N8N_SECURE_COOKIE: "false"                             # plain http on the LAN
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "4"
      EXECUTIONS_DATA_MAX_AGE: "720"                         # hours
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./n8n:/home/node/.n8n
    depends_on:
      senior-postgres:
        condition: service_healthy

  senior-whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    container_name: senior-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
      ASR_DEVICE: cpu
      ASR_QUANTIZATION: int8
      ASR_MODEL_PATH: /data/whisper
      MODEL_IDLE_TIMEOUT: "1800"
    volumes:
      - ./whisper:/data/whisper
    # no published port

  senior-mcp:
    <<: *acervo
    container_name: senior-mcp
    command: ["python", "mcp_server.py"]
    # no published port

  senior-agente:
    <<: *acervo
    container_name: senior-agente
    command: ["python", "agente.py"]
    environment:
      <<: *acervo-env
      ANTHROPIC_API_KEY: ${MIA_SENIOR_ANTHROPIC_API_KEY}
      MCP_URL: http://senior-mcp:8000/mcp
    # no published port

  senior-painel:
    <<: *acervo
    container_name: senior-painel
    command: ["python", "painel.py"]
    ports:
      - "8080:8080"            # LAN only; login admin + MIA_SENIOR_WAHA_DASHBOARD_PASSWORD
    environment:
      <<: *acervo-env
      PAINEL_DSN: host=senior-postgres dbname=acervo_bot user=senior password=${MIA_SENIOR_POSTGRES_PASSWORD}
      PAINEL_SENHA: ${MIA_SENIOR_WAHA_DASHBOARD_PASSWORD}
      N8N_URL: http://192.168.2.23:5678

  senior-sync:
    image: senior-acervo:local
    container_name: senior-sync
    restart: unless-stopped
    command: ["./sync.sh"]
    environment:
      TZ: America/Sao_Paulo
      SYNC_INTERVALO: "1800"
    volumes:
      - ./acervo:/acervo
      - ./sync/chave:/chave:ro   # read-only deploy key + pinned known_hosts
