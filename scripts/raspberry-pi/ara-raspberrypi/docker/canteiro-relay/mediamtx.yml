###############################################################################
# MediaMTX — RTSP relay of the ARA canteiro camera onto the tailnet
#
# Authoritative copy: scripts/raspberry-pi/ara-raspberrypi/docker/canteiro-relay/mediamtx.yml
# Live copy:          ara-raspberrypi2:~/canteiro-relay/mediamtx.yml
#                     (600 eduardocenci, ro-mounted into the canteiro-relay
#                     container — the live copy carries the real access key
#                     in place of __ARA_CANTEIRO_CAM_KEY__, value from
#                     repo-root .env ARA_CANTEIRO_CAM_KEY; URL-encode it if
#                     it contains symbols)
#
# Camera: Intelbras iM9+ Full Color (Mibo) "iM9 M Full Color-9411" at
#         192.168.1.56 on the ara house LAN. RTSP is factory-enabled on :554
#         (Digest auth): user admin, password = the camera's "chave de acesso"
#         (printed on the sticker on the camera base; the factory key keeps
#         working for RTSP even if the app key is later changed).
# Consumers: canteiro-hls (mediamtx) on bnu-raspberrypi pulls each main ONCE
#            over the tailnet (`canteiro`, and `canteiro-alt` as its path
#            `canteiro-fixa`) and hands them to go2rtc there -> bnu Frigate
#            LXC 105 record feeds + the live MOSAIC [fixed | PT] (TV cast,
#            /live page, since 2026-11-14); go2rtc pulls the two substreams
#            for Frigate's detect feeds. Keep it one copy of each — Starlink
#            upload cannot sustain two parallel pulls of the SAME main
#            (stall seen 2026-08-26).
###############################################################################

logLevel: info

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]   # no UDP listeners; the tailnet consumer uses TCP
# Per-reader write queue (default 512 packets ~ 3 s of the HEVC main). The readers sit on
# bnu behind a Tailscale DERP (TCP) path over Starlink: a 2-3 s stall overflowed the queue
# and the relay logged "reader is too slow, discarding N frames" (73 lines on 2026-11-04
# alone, 1-2 % TCP retransmits on the reader sockets). 2048 rides out ~13 s before
# discarding, at ~2.5 MB of RAM per reader (2026-11-05, two-main-stream attempt).
writeQueueSize: 2048
rtmp: no
hls: no
webrtc: no
srt: no
moq: no                 # default-on in v1.20+; would open :8892/:8893
api: no
metrics: no
pprof: no

paths:
  # Lens mapping (verified 2026-08-24 by moving the PT lens and watching the
  # streams): channel=1 = PT lens (motorized, auto-tracking; ONVIF
  # Profile000), parked at its rest position looking RIGHT; channel=2 = fixed
  # lens, looking LEFT to the street. The bnu TV/live page show the mosaic
  # [fixed | PT] of the two mains since 2026-11-14. Nothing automated moves
  # the PT lens any more; `canteiro-ptz` (../../ptz/) is a manual tool.
  # subtype=0 = main stream (H.265 3MP), subtype=1 = substream (H.264 640x480).
  canteiro:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=1&subtype=0
    rtspTransport: tcp
    sourceOnDemand: no      # keep pulling 24/7 — instant attach for bnu's consumers
  canteiro-alt:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=2&subtype=0
    rtspTransport: tcp
    sourceOnDemand: yes     # fixed lens; held open 24/7 by bnu canteiro-hls (`canteiro-fixa`)
  canteiro-sub:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=1&subtype=1
    rtspTransport: tcp
    sourceOnDemand: yes     # PT-lens 640x480 H264 substream — bnu Frigate detect feed
  canteiro-alt-sub:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=2&subtype=1
    rtspTransport: tcp
    sourceOnDemand: yes     # fixed-lens 640x480 H264 substream — bnu Frigate `canteiro_fixa`
                            # detect feed (2026-11-04; held open 24/7 while Frigate is up; also its record feed until 2026-11-05, when record moved to canteiro-alt)
