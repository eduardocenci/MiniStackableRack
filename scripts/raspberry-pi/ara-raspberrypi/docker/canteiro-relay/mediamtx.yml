###############################################################################
# MediaMTX — RTSP relay of the ARA canteiro camera onto the tailnet
#
# Authoritative copy: scripts/raspberry-pi/ara-raspberrypi/docker/canteiro-relay/mediamtx.yml
# Live copy:          ara-raspberrypi:~/canteiro-relay/mediamtx.yml
#                     (600 eduardocenci, ro-mounted into the canteiro-relay
#                     container — the live copy carries the real access key
#                     in place of __ARA_CANTEIRO_CAM_KEY__, value from
#                     repo-root .env ARA_CANTEIRO_CAM_KEY; URL-encode it if
#                     it contains symbols)
#
# Camera: Intelbras iM9+ Full Color (Mibo) "iM9 M Full Color-9411" at
#         192.168.1.56 on the ara house LAN. RTSP is factory-enabled on :554
#         (Digest auth): user admin, password = the camera's "chave de acesso"
#         (printed on the sticker on the camera base; the factory key keeps
#         working for RTSP even if the app key is later changed).
# Consumers: go2rtc on bnu-raspberrypi pulls `canteiro` ONCE over the tailnet
#            and fans it out on the bnu LAN (TV cast, /live HLS page, and the
#            bnu Frigate LXC 105 record feed); Frigate's detect feed pulls
#            `canteiro-sub`. Keep it this way — Starlink upload cannot
#            sustain two parallel main-stream pulls (stall seen 2026-08-26).
###############################################################################

logLevel: info

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]   # no UDP listeners; the tailnet consumer uses TCP
rtmp: no
hls: no
webrtc: no
srt: no
moq: no                 # default-on in v1.20+; would open :8892/:8893
api: no
metrics: no
pprof: no

paths:
  # Lens mapping (verified 2026-08-24 by moving the PT lens and watching the
  # streams): channel=1 = PT lens (motorized, auto-tracking; ONVIF
  # Profile000) — this is what the bnu TV/live page shows; channel=2 = fixed
  # lens. Aim the PT lens with `canteiro-ptz` (see ../../ptz/).
  # subtype=0 = main stream (H.265 3MP), subtype=1 = substream (H.264 640x480).
  canteiro:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=1&subtype=0
    rtspTransport: tcp
    sourceOnDemand: no      # keep pulling 24/7 — instant attach for bnu's consumers
  canteiro-alt:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=2&subtype=0
    rtspTransport: tcp
    sourceOnDemand: yes     # second lens, pulled only when someone watches it
  canteiro-sub:
    source: rtsp://admin:__ARA_CANTEIRO_CAM_KEY__@192.168.1.56:554/cam/realmonitor?channel=1&subtype=1
    rtspTransport: tcp
    sourceOnDemand: yes     # PT-lens 640x480 H264 substream — bnu Frigate detect feed
