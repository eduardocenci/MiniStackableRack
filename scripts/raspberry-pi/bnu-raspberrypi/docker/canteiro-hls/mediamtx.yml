# canteiro-hls — mediamtx: HLS packager AND the bnu end of the canteiro main
# stream (bnu-raspberrypi)
#
# Authoritative copy: scripts/raspberry-pi/bnu-raspberrypi/docker/canteiro-hls/mediamtx.yml
# Live copy:          bnu-raspberrypi:~/canteiro-hls/mediamtx.yml (ro mount into the container)
#
# Why this exists (2026-08-29): go2rtc's built-in HLS keeps a ~1 s live window
# (2 segments falsely advertised as 0.5 s each; real cadence ~2 s) — any hiccup
# longer than that rotates the segment out from under hls.js, the /live page
# hard-restarts, and a restart then waits up to 4 s (camera GOP) for a
# keyframe. That was the "stream keeps interrupting" complaint.
# mediamtx packages the stream into honest 4 s segments with a 7-segment
# (~28 s) window, so the page can hold a real buffer that rides out Starlink
# jitter.
#
# Why it pulls the relay itself (2026-10-29): the camera closes its RTSP
# session at the start of most PTZ excursions of the timelapse (sunrise
# 05:00–06:00, sunset 16:40–19:00). The ara relay then drops its readers and
# reopens the camera ~5 s later with a NEW random RTP timestamp base. While
# go2rtc was the WAN puller it swapped its producer under the SAME RTSP
# session it served here, so this muxer got a timestamp jump it never digests
# ("sample timestamp is impossible to handle", crash-looping every 10 s) until
# the watchdog restarted both containers ~100 s later.
# Now this path is the single puller of the main stream (Starlink still
# carries exactly one copy) and go2rtc reads it from 127.0.0.1:8555:
#   - mediamtx sees the relay EOF itself and reconnects (5 s pause, +5 s when
#     it races the relay's own camera reconnect → back in ~5–10 s);
#   - alwaysAvailable keeps every reader (the HLS muxer, go2rtc and through it
#     Frigate/TV) connected meanwhile, fills the gap with offline.mp4 on repeat
#     and re-bases the camera on one continuous timeline — no muxer crash, no
#     hls.js restart, no auto-heal.

logLevel: info

# go2rtc owns RTSP :8554 / HTTP :1984 on this Pi; this RTSP server is only the
# local hop to go2rtc (127.0.0.1:8555, TCP — no UDP listeners).
api: no
metrics: no
pprof: no
playback: no
rtsp: yes
rtspAddress: 127.0.0.1:8555
rtspTransports: [tcp]
rtspEncryption: "no"
rtmp: no
webrtc: no
srt: no
moq: no

hls: yes
hlsAddress: :8888        # LAN+tailnet trust, same level as go2rtc :1984/:8554;
                         # browsers reach it via tailscale serve at /hls (HTTPS)
hlsVariant: fmp4         # H265 requires fMP4; plain (non-low-latency) variant —
                         # stability over latency for a canteiro monitor
hlsSegmentCount: 7       # ~28 s live window (segments land at the 4 s GOP)
hlsSegmentDuration: 4s   # matches the iM9 keyframe interval exactly
hlsAlwaysRemux: yes      # muxer always hot → instant page loads, no
                         # first-viewer keyframe wait

paths:
  canteiro:
    source: rtsp://ara-raspberrypi2:8554/canteiro
    rtspTransport: tcp
    # The card carries the camera's exact tracks (H265 2304x1296 + AAC 16 kHz
    # mono): mediamtx refuses a source whose tracks differ from the offline
    # stream's, and the built-in card (alwaysAvailableTracks) cannot do 16 kHz
    # AAC. Regenerate with make-offline-card.sh if the camera streams change.
    alwaysAvailable: yes
    alwaysAvailableFile: /offline.mp4
