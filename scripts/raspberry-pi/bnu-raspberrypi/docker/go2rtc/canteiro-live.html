<!DOCTYPE html>
<!-- Canteiro ao vivo — player HLS universal (House Hangar, ARA)
     Authoritative copy: scripts/raspberry-pi/bnu-raspberrypi/go2rtc/canteiro-live.html
     Live copy: bnu-raspberrypi:/usr/local/share/canteiro-live/index.html,
     served at https://bnu-raspberrypi.woodpecker-shark.ts.net/live via
     `tailscale serve` (path /live).
     Video: same-origin /hls/mosaico/index.m3u8 — the MOSAIC [fixed lens |
     PT lens] since 2026-11-14 (H.264 2560x720, composed by canteiro-mosaico
     in the bnu Frigate LXC); ?src=canteiro or ?src=canteiro-fixa plays one
     lens alone (HEVC 2304x1296). mediamtx (canteiro-hls
     service, ../canteiro-hls/) packaging the shared go2rtc producer into
     honest 4 s segments with a ~35 s live window. (Until 2026-08-29 this
     pointed at go2rtc's own HLS, whose ~1 s window collapsed on any Starlink
     or DERP hiccup — the "stream keeps interrupting" era.)
     ?cookieCheck=1 pre-answers mediamtx's cookie-support redirect, which
     would otherwise escape the /hls mount (tailscale serve strips the path
     prefix, but the redirect Location is absolute).
     - hls.js with ~12 s live offset (absorbs Starlink jitter); native HLS on iOS.
     - Hidden tab: stops loading (no bandwidth, no go2rtc/mediamtx log churn),
       resumes at the live edge when shown again.
     - Offline screen: after ~15 s without recovery shows "CANTEIRO FORA DO
       AR" with an offline timer, over the last good frame (canvas-captured
       every 30 s while playing), retrying every 5 s while visible.
     - Since 2026-11-23: the last 3 Frigate detections of each lens (preview GIFs)
       over the video, bottom right of that lens — /painel/det.json + /painel/det/<id>.gif
       from canteiro-painel; a click plays the recording. ?det=0 hides them.
     - Since 2026-11-24: the mouse over a title of the VENCIMENTOS card shows the whole
       note of the sheet (Observações) — /painel/zonas.json from canteiro-painel gives the
       rectangles of the current PNG and their texts; a tap does the same on a phone. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteiro ao vivo — House Hangar</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  /* Mosaico (32:9) + painel de dados (32:9) = 16:9 — desde 15/11/2026. */
  #painel { display: none; }
  body.painel { display: flex; flex-direction: column; justify-content: center; }
  body.painel video, body.painel #painel { display: block; width: 100vw;
         height: min(50vh, 28.125vw); object-fit: contain; }
  body.painel #painel { background: #0e1116; }
  /* Últimas detecções de cada lente (GIFs do Frigate) sobre o vídeo — desde 23/11/2026.
     #det cobre exatamente a imagem do vídeo (posicionado por JS); cada .grp é o canto
     inferior direito de uma lente. Sobe para liberar a barra de controles do player. */
  #det { position: fixed; z-index: 1; pointer-events: none; display: none; }
  #det .grp { position: absolute; bottom: 2.5%; display: flex; justify-content: flex-end;
              gap: 0.6%; padding-right: 0.5%; box-sizing: border-box; transition: transform .15s; }
  video:hover ~ #det .grp, #det:hover .grp { transform: translateY(-46px); }
  #det a { position: relative; display: block; flex: 0 0 var(--tw); aspect-ratio: 16 / 9;
           pointer-events: auto; cursor: pointer; border-radius: 6px; overflow: hidden;
           border: 2px solid #f5a524; background: #111; box-shadow: 0 1px 6px #000a; }
  #det a.alert { border-color: #e5484d; }
  #det a img { width: 100%; height: 100%; object-fit: fill; display: block; }
  #det a span { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 5px 1px;
                display: flex; align-items: center; justify-content: space-between; gap: 3px;
                color: #fff; font: 600 clamp(8px, 0.72vw, 13px) system-ui, sans-serif;
                background: linear-gradient(transparent, #000b); text-shadow: 0 1px 2px #000; }
  /* ícone do tipo de detecção (pessoa, veículo…), da altura do texto "Xm atrás" */
  #det a span svg { height: 1em; width: 1em; flex: none; margin-left: 2px; fill: #fff; stroke: none;
                    filter: drop-shadow(0 1px 1px #000); }
  #det a span em { flex: 1; font-style: normal; white-space: nowrap; overflow: hidden; }
  /* Texto completo da planilha ao passar o mouse num título do card VENCIMENTOS — desde 24/11/2026. */
  #dica { position: fixed; z-index: 5; display: none; max-width: min(460px, 92vw); padding: 10px 12px;
          background: #181d25f2; color: #eceff4; border: 1px solid #3a4454; border-radius: 8px;
          font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 4px 18px #000c; pointer-events: none; }
  #dica b { display: block; color: #ecac3c; margin-bottom: 4px; }
  #dica i { display: block; font-style: normal; color: #60c878; margin-bottom: 4px; }
  #dica i.nao { color: #e86060; }
  #clip { position: fixed; inset: 0; z-index: 4; display: none; background: #000d;
          align-items: center; justify-content: center; }
  #clip.show { display: flex; }
  #clip video, #clip img { width: auto; height: auto; max-width: 94vw; max-height: 90vh; background: #000; }
  #clip p { position: absolute; top: 10px; left: 14px; margin: 0; color: #ddd;
            font: 14px system-ui, sans-serif; }
  #msg { position: fixed; top: 12px; left: 12px; color: #9a9a9a;
         font: 14px system-ui, sans-serif; z-index: 2; }
  #offline { position: fixed; inset: 0; display: none; z-index: 3;
             background: #000; color: #eee; font-family: system-ui, sans-serif;
             align-items: center; justify-content: center; text-align: center; }
  #offline.show { display: flex; }
  #lastframe { position: absolute; inset: 0; width: 100%; height: 100%;
               object-fit: contain; opacity: 0.22; filter: grayscale(60%); }
  #offbox { position: relative; z-index: 1; padding: 24px; }
  #offbox .icon { font-size: 64px; }
  #offbox h1 { margin: 12px 0 6px; font-size: 28px; letter-spacing: 1px; }
  #offbox p { margin: 4px 0; color: #b5b5b5; font-size: 15px; }
  #offbox .timer { color: #e0a030; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="msg">carregando…</div>
<div id="offline">
  <img id="lastframe" alt="" style="display:none">
  <div id="offbox">
    <div class="icon">📡</div>
    <h1>CANTEIRO FORA DO AR</h1>
    <p>Sem conexão com a obra — Starlink ou energia do barracão.</p>
    <p class="timer">offline há <span id="offsecs">0:00</span></p>
    <p>Reconexão automática ativa — a imagem volta sozinha.</p>
  </div>
</div>
<video id="v" muted autoplay playsinline controls></video>
<div id="det"></div>
<img id="painel" alt="Painel do canteiro: rede, portão, entregas, plano da semana">
<div id="dica"></div>
<div id="clip"><p></p></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  // MOSAICO [lente fixa (rua) | lente PT] desde 14/11/2026 — H.264 2560x720.
  // As lentes sozinhas seguem em /hls/canteiro (PT) e /hls/canteiro-fixa: ?src=canteiro|canteiro-fixa
  const ONLY = new URLSearchParams(location.search).get('src');
  const PATH = ['canteiro', 'canteiro-fixa'].includes(ONLY) ? ONLY : 'mosaico';
  const SRC = '/hls/' + PATH + '/index.m3u8?cookieCheck=1';
  // Painel de dados sob o mosaico (canteiro-painel, tailscale serve /painel -> :8557),
  // refeito a cada minuto. ?painel=0 volta ao vídeo em tela cheia; uma lente só não leva painel.
  if (PATH === 'mosaico' && new URLSearchParams(location.search).get('painel') !== '0') {
    const pimg = document.getElementById('painel');
    // Zonas de hover do PNG atual (em pixels do próprio PNG): título, orientação e a observação da planilha.
    let zonas = { w: 1920, h: 540, zonas: [] };
    const dica = document.getElementById('dica');
    const loadZonas = () => fetch('/painel/zonas.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null).then(j => { if (j && j.zonas) zonas = j; }).catch(() => {});
    const load = () => { pimg.src = '/painel/painel.png?t=' + Date.now(); loadZonas(); };
    function zonaEm(ev) {            // ponto do mouse -> pixel do PNG (object-fit: contain) -> zona
      const r = pimg.getBoundingClientRect(), ar = zonas.w / zonas.h;
      let w = r.width, h = r.width / ar;
      if (h > r.height) { h = r.height; w = h * ar; }
      const x = (ev.clientX - r.left - (r.width - w) / 2) * zonas.w / w;
      const y = (ev.clientY - r.top - (r.height - h) / 2) * zonas.h / h;
      return zonas.zonas.find(z => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h);
    }
    function mostraDica(ev) {
      const z = zonaEm(ev);
      pimg.style.cursor = z ? 'help' : '';
      if (!z) { dica.style.display = 'none'; return; }
      dica.textContent = '';
      const b = document.createElement('b'); b.textContent = z.titulo; dica.append(b);
      if (z.pagar) {
        const i = document.createElement('i'); i.textContent = z.pagar;
        if (z.pagar.startsWith('NÃO')) i.className = 'nao';
        dica.append(i);
      }
      if (z.texto) dica.append(document.createTextNode(z.texto));
      dica.style.display = 'block';
      const d = dica.getBoundingClientRect();   // acima do cursor; nunca para fora da janela
      dica.style.left = Math.max(6, Math.min(ev.clientX + 14, innerWidth - d.width - 6)) + 'px';
      dica.style.top = Math.max(6, ev.clientY - d.height - 14) + 'px';
    }
    pimg.addEventListener('mousemove', mostraDica);
    pimg.addEventListener('click', mostraDica);          // toque no celular
    pimg.addEventListener('mouseleave', () => { dica.style.display = 'none'; });
    pimg.addEventListener('load', () => document.body.classList.add('painel'));
    pimg.addEventListener('error', () => { if (!pimg.naturalWidth) document.body.classList.remove('painel'); });
    load();
    setInterval(load, 30000);
  }
  const OFFLINE_AFTER_MS = 15000;   // tolera rebuffer curto antes de declarar queda
  const RETRY_MS = 5000;
  const v = document.getElementById('v');
  const msg = document.getElementById('msg');
  const offline = document.getElementById('offline');
  const offsecs = document.getElementById('offsecs');
  const lastframe = document.getElementById('lastframe');
  let hls = null, retryTimer = null, downSince = null, offTicker = null;
  let lastFrameURL = null;

  function setMsg(t) { msg.textContent = t; msg.style.display = t ? 'block' : 'none'; }

  // Guarda um quadro a cada 30 s enquanto toca — vira o fundo da tela offline.
  setInterval(() => {
    if (v.readyState >= 2 && !v.paused && v.videoWidth) {
      try {
        const c = document.createElement('canvas');
        c.width = v.videoWidth / 2; c.height = v.videoHeight / 2;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        lastFrameURL = c.toDataURL('image/jpeg', 0.7);
      } catch (e) {}
    }
  }, 30000);

  function fmt(ms) {
    const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    if (m >= 60) return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
    return m + ':' + String(s % 60).padStart(2, '0');
  }

  function markDown() {
    if (!downSince) downSince = Date.now();
    if (Date.now() - downSince > OFFLINE_AFTER_MS && !offline.classList.contains('show')) {
      if (lastFrameURL) { lastframe.src = lastFrameURL; lastframe.style.display = 'block'; }
      offline.classList.add('show');
      setMsg('');
      offTicker = setInterval(() => { offsecs.textContent = fmt(Date.now() - downSince); }, 1000);
    }
  }

  function markUp() {
    downSince = null;
    clearInterval(offTicker);
    offline.classList.remove('show');
    setMsg('');
  }

  function scheduleRetry() {
    markDown();
    if (!offline.classList.contains('show')) setMsg('reconectando…');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(start, RETRY_MS);
  }

  function start() {
    if (document.hidden) return;   // aba oculta não briga pela banda nem polui log
    clearTimeout(retryTimer);
    if (window.Hls && Hls.isSupported()) {
      if (hls) { hls.destroy(); hls = null; }
      hls = new Hls({
        liveSyncDuration: 12,        // ~12 s atrás do ao vivo (janela real de ~35 s
        liveMaxLatencyDuration: 30,  // no mediamtx dá folga p/ Starlink + DERP)
        maxBufferLength: 40,
        backBufferLength: 10,
        lowLatencyMode: false,
      });
      hls.loadSource(SRC);
      hls.attachMedia(v);
      hls.on(Hls.Events.FRAG_BUFFERED, () => { markUp(); v.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_e, data) => { if (data.fatal) scheduleRetry(); });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = SRC + '&_=' + Date.now();   // evita cache do player nativo iOS
      v.play().catch(() => {});
    } else {
      setMsg('navegador sem suporte a HLS');
    }
  }

  // Caminho nativo (iOS) + geral: 'playing' = up; erro/estagnação = down.
  v.addEventListener('playing', markUp);
  v.addEventListener('error', scheduleRetry);
  v.addEventListener('stalled', markDown);
  v.addEventListener('waiting', markDown);
  // ---- Últimas detecções de cada lente (pedido Eduardo 23/11/2026) -----------------
  // As 3 últimas de cada lente, sem filtro de duração e sem validade (a idade fica escrita),
  // mais nova à esquerda; borda vermelha = alerta, âmbar = detecção, como no Frigate.
  // GIFs e lista vêm do canteiro-painel (/painel/det.json, /painel/det/<id>.gif), que os lê
  // do Frigate do bnu. Clicar abre a gravação do trecho (/painel/det/<id>.mp4). ?det=0 desliga.
  const det = document.getElementById('det');
  const clip = document.getElementById('clip');
  const LENTES = PATH === 'mosaico' ? ['canteiro_fixa', 'canteiro']      // esquerda | direita
               : [PATH === 'canteiro' ? 'canteiro' : 'canteiro_fixa'];
  const DET_ON = new URLSearchParams(location.search).get('det') !== '0';
  let detKey = '', detItems = [];
  const ROTULO = { person: 'pessoa', car: 'veículo', bus: 'ônibus', motorcycle: 'moto', bicycle: 'bicicleta' };
  // Ícone minúsculo do tipo, no canto inferior direito da miniatura (pedido Eduardo 23/11/2026).
  // Constantes fixas — nunca texto vindo do Frigate; tipo sem ícone = só o texto.
  const RODAS = '<circle cx="5.5" cy="16.5" r="4" fill="none" stroke="#fff" stroke-width="W"/>' +
                '<circle cx="18.5" cy="16.5" r="4" fill="none" stroke="#fff" stroke-width="W"/>';
  const ICONE = {
    person: '<circle cx="12" cy="4.5" r="3"/><path d="M8 9h8a2 2 0 0 1 2 2v5h-2v7h-2.6v-6h-2.8v6H8v-7H6v-5a2 2 0 0 1 2-2z"/>',
    car: '<path fill-rule="evenodd" d="M5 10l1.6-4.6A2 2 0 0 1 8.5 4h7a2 2 0 0 1 1.9 1.4L19 10a2 2 0 0 1 2 2v6h-2v1.5a1.25 1.25 0 0 1-2.5 0V18h-9v1.5a1.25 1.25 0 0 1-2.5 0V18H3v-6a2 2 0 0 1 2-2zm2.3 0h9.4l-1.2-4h-7zM6.5 15a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm11 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>',
    bus: '<path fill-rule="evenodd" d="M4 5a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v13h-1.5v1.5a1.25 1.25 0 0 1-2.5 0V18H8v1.5a1.25 1.25 0 0 1-2.5 0V18H4zm2 1v6h12V6zm1.5 10a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5zm9 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5z"/>',
    bicycle: RODAS.replace(/W/g, '1.8') + '<path d="M5.5 16.5L9.5 8h5.5l3.5 8.5M9 8h-2.5M12 16.5L9.8 9.5M12 16.5l3.5-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    motorcycle: RODAS.replace(/W/g, '2.6') + '<path d="M6 15l3.5-5h6l2.5 5h-3.5l-2-2.5H10.5L9 15z"/><path d="M14.5 10l1.5-3h3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
  };
  const icones = i => [...new Set(i.objetos)].filter(o => ICONE[o])
    .map(o => '<svg viewBox="0 0 24 24" aria-label="' + ROTULO[o] + '">' + ICONE[o] + '</svg>').join('');
  const objetos = i => i.objetos.map(o => ROTULO[o] || o).join(', ');

  function idade(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return 'agora';
    if (s < 3600) return Math.floor(s / 60) + 'm atrás';
    if (s < 86400) return Math.floor(s / 3600) + 'h atrás';
    return Math.floor(s / 86400) + 'd atrás';
  }

  function placeDet() {              // #det = o retângulo da IMAGEM dentro do <video> (object-fit: contain)
    const r = v.getBoundingClientRect();
    const ar = v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : (LENTES.length === 2 ? 32 / 9 : 16 / 9);
    let w = r.width, h = r.width / ar;
    if (h > r.height) { h = r.height; w = h * ar; }
    det.style.left = (r.left + (r.width - w) / 2) + 'px';
    det.style.top = (r.top + (r.height - h) / 2) + 'px';
    det.style.width = w + 'px';
    det.style.height = h + 'px';
    det.style.setProperty('--tw', (w * (LENTES.length === 2 ? 0.088 : 0.12)) + 'px');
  }

  function drawDet(cams) {
    const key = LENTES.map(c => (cams[c] || []).map(i => i.id).join(',')).join('|');
    if (key !== detKey) {            // só refaz o DOM quando a lista muda (não reinicia os GIFs à toa)
      detKey = key;
      det.textContent = '';
      detItems = [];
      LENTES.forEach((c, n) => {
        const g = document.createElement('div');
        g.className = 'grp';
        g.style.left = (n * 100 / LENTES.length) + '%';
        g.style.width = (100 / LENTES.length) + '%';
        (cams[c] || []).forEach(i => {
          const a = document.createElement('a');
          if (i.sev === 'alert') a.className = 'alert';
          const img = document.createElement('img');
          img.src = '/painel/det/' + i.id + '.gif';
          img.alt = '';
          const wrap = document.createElement('span');
          const sp = document.createElement('em');
          wrap.append(sp);
          wrap.insertAdjacentHTML('beforeend', icones(i));
          a.append(img, wrap);
          a.addEventListener('click', () => openClip(i, c));
          g.append(a);
          detItems.push([i, a, sp]);
        });
        det.append(g);
      });
    }
    const hora = ts => new Date(ts * 1000).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo' });
    detItems.forEach(([i, a, sp]) => {
      sp.textContent = idade(i.start);
      a.title = hora(i.start) + ' – ' + hora(i.end) + (i.objetos.length ? ' · ' + objetos(i) : '');
    });
    det.style.display = detItems.length ? 'block' : 'none';
    placeDet();
  }

  function loadDet() {
    if (document.hidden) return;
    fetch('/painel/det.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
      .then(j => { if (j && j.cams) drawDet(j.cams); }).catch(() => {});
  }

  function openClip(i, cam) {
    const quando = new Date(i.start * 1000).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
    clip.querySelector('p').textContent = (cam === 'canteiro' ? 'Lente PT' : 'Lente fixa') + ' · ' + quando +
      (i.objetos.length ? ' · ' + objetos(i) : '') + ' — clique fora para fechar';
    const old = clip.querySelector('video, img');
    if (old) old.remove();
    const cv = document.createElement('video');
    cv.controls = true; cv.autoplay = true; cv.muted = true; cv.playsInline = true;
    cv.addEventListener('error', () => {           // sem gravação (já apagada): mostra o GIF grande
      const big = document.createElement('img');
      big.src = '/painel/det/' + i.id + '.gif';
      big.style.width = 'min(94vw, 960px)';
      cv.replaceWith(big);
    });
    cv.src = '/painel/det/' + i.id + '.mp4';
    cv.addEventListener('click', e => e.stopPropagation());
    clip.append(cv);
    clip.classList.add('show');
  }
  function closeClip() {
    const m = clip.querySelector('video, img');
    if (m) { if (m.pause) m.pause(); m.remove(); }
    clip.classList.remove('show');
  }
  clip.addEventListener('click', closeClip);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeClip(); });

  if (DET_ON) {
    loadDet();
    setInterval(loadDet, 15000);
    window.addEventListener('resize', placeDet);
    v.addEventListener('loadedmetadata', placeDet);
    v.addEventListener('resize', placeDet);
    document.getElementById('painel').addEventListener('load', placeDet);   // o painel muda a altura do vídeo
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {           // pausa o consumo enquanto ninguém olha
      clearTimeout(retryTimer);
      if (hls) hls.stopLoad();
      return;
    }
    if (hls) { hls.startLoad(); v.play().catch(() => {}); }
    else start();
    if (DET_ON) loadDet();
  });
  start();
</script>
</body>
</html>
