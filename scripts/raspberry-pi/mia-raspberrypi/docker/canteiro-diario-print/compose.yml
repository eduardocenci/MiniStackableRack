# canteiro-diario-print — prints the day's Diário de Obra (resumo.pdf from Drive
# CeuAzul/Diario/<D>/) on the MIA HP OfficeJet Pro 6970 through the host CUPS queue.
# Decisão Eduardo 09/09/2026. Live copy: mia-raspberrypi:~/canteiro-diario-print/
services:
  canteiro-diario-print:
    build: .
    image: canteiro-diario-print:local
    container_name: canteiro-diario-print
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    init: true
    env_file: env/canteiro-diario-print.env
    environment:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      RCLONE_CONFIG: /config/rclone/rclone.conf
      STATE_DIR: /tmp/canteiro-diario
    volumes:
      - /home/eduardocenci/.config/rclone:/config/rclone
      # The DIRECTORY, never the .sock file: the host cupsd is restarted every midnight by
      # logrotate (/etc/logrotate.d/cups-daemon → `cups restart`) and re-creates the socket, so a
      # bind-mounted socket FILE keeps pointing at the dead inode — on 10/09/2026 every print tick
      # died with "lp: The printer or class does not exist" (= lp could not reach the scheduler
      # at all; `lpstat -r` inside said "scheduler is not running") while the host queue was fine.
      # /run/cups is root-owned and cups.sock is srw-rw-rw- — uid 1000 needs no group.
      - /run/cups:/run/cups
    command: ["supercronic", "-passthrough-logs", "/app/crontab-diario-print"]
