# The UPS MUST be called "ups": a Synology NAS set to "Synology UPS server" asks for
# exactly ups@<this host>.
maxretry = 3

[ups]
  driver = usbhid-ups
  port = auto
  vendorid = 0764
  productid = 0501
  desc = "mia rack nobreak - CyberPower CP1000PFCLCD"
  pollinterval = 1
  # "Low battery" (LB) by remaining runtime - regra Eduardo 26/11/2026: 10 minutes.
  # ignorelb: the driver ignores the UPS's own LB flag (the UPS raises it at 300 s / 10 %)
  # and sets LB itself when battery.runtime < 600 s or battery.charge < 10 %. Nothing is
  # written to the UPS. LB is what the clients act on (the Synology NAS enters safe mode
  # on "OB LB").
  ignorelb
  override.battery.runtime.low = 600
  override.battery.charge.low = 10
